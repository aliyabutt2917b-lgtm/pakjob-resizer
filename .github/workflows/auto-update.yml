name: Auto-Clean Expired Jobs & Rebuild

on:
  schedule:
    # Runs every night at midnight UTC automatically
    - cron: '0 0 * * *'
  workflow_dispatch: # Manual trigger button

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Build Script to Clean & Regenerate HTML
        run: node build.js

      - name: Commit and Push Updated File to Vercel
        run: |
          git config --global user.name "Auto-Update-Agent"
          git config --global user.email "bot@github.com"
          git add index.html
          git commit -m "Auto-clean expired job deadlines" || exit 0
          git push