name: Auto-Clean Expired Jobs & Rebuild

on:
  schedule:
    - cron: '0 0 * * *' # Midnight UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run AI Scraper for Latest Jobs
        run: node ai-fetch.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Run Build Script
        run: node build.js

      - name: Commit and Push Updated File
        run: |
          git config --global user.name "Auto-Update-Agent"
          git config --global user.email "bot@github.com"
          git add index.html dynamic-jobs.json || true
          git commit -m "Auto-update dynamic AI jobs and build portal" || exit 0
          git push